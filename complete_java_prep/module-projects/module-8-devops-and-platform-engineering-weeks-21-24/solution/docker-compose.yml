version: '3.9'
services:
  module6-backend:
    build:
      context: ../../module-6-security-and-identity-weeks-17-18/solution
      dockerfile: ../../module-8-devops-and-platform-engineering-weeks-21-24/solution/docker/backend/Dockerfile
    image: module6-backend:dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"

  module7-frontend:
    build:
      context: ../../module-7-frontend-for-java-full-stack-weeks-19-20/solution
      dockerfile: ../../module-8-devops-and-platform-engineering-weeks-21-24/solution/docker/frontend/Dockerfile
    image: module7-frontend:dev
    ports:
      - "8088:80"

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
