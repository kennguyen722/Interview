version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: module4-postgres
    environment:
      POSTGRES_DB: module4
      POSTGRES_USER: module4
      POSTGRES_PASSWORD: module4
    ports:
      - "5432:5432"
    volumes:
      - module4_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U module4 -d module4"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  module4_pgdata:
